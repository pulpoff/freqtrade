<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotCrypto - Automated Crypto Trading</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lightweight Charts (TradingView) -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

    <!-- Custom Overrides -->
    <link rel="stylesheet" href="css/botcrypto.css">
</head>
<body>
    <div id="app" class="d-flex">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar d-flex flex-column flex-shrink-0">
            <div class="sidebar-header px-3 py-3 border-bottom border-secondary">
                <a href="#" class="d-flex align-items-center text-decoration-none" onclick="App.navigate('dashboard')">
                    <div class="logo-icon me-2">
                        <i class="bi bi-robot"></i>
                    </div>
                    <span class="logo-text fw-bold fs-5 text-white">botcrypto</span>
                </a>
            </div>
            <ul class="nav nav-pills flex-column px-2 py-3 flex-grow-1" id="sidebarNav">
                <li class="nav-item">
                    <a class="nav-link active" href="#" data-page="dashboard" onclick="App.navigate('dashboard')">
                        <i class="bi bi-grid-1x2 me-2"></i><span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="strategy-builder" onclick="App.navigate('strategy-builder')">
                        <i class="bi bi-diagram-3 me-2"></i><span>Strategy Builder</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="backtesting" onclick="App.navigate('backtesting')">
                        <i class="bi bi-clock-history me-2"></i><span>Backtesting</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="strategy-store" onclick="App.navigate('strategy-store')">
                        <i class="bi bi-shop me-2"></i><span>Strategy Store</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="trades" onclick="App.navigate('trades')">
                        <i class="bi bi-arrow-left-right me-2"></i><span>Trades</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="config" onclick="App.navigate('config')">
                        <i class="bi bi-gear me-2"></i><span>Configuration</span>
                    </a>
                </li>
            </ul>
            <div class="px-3 py-3 border-top border-secondary">
                <div class="d-flex align-items-center" id="connectionStatus" style="cursor:pointer" onclick="App.showConnectModal()">
                    <span class="status-dot disconnected me-2"></span>
                    <small class="text-secondary status-text">Disconnected</small>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-wrapper flex-grow-1 d-flex flex-column">
            <!-- Top Navbar -->
            <nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-4">
                <div class="d-flex align-items-center">
                    <button class="btn btn-link text-secondary d-md-none me-2" id="menuToggle" onclick="document.getElementById('sidebar').classList.toggle('show')">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <h5 class="mb-0 fw-semibold" id="pageTitle">Dashboard</h5>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">EN</button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">English</a></li>
                            <li><a class="dropdown-item" href="#">Français</a></li>
                        </ul>
                    </div>
                    <button class="btn btn-link text-secondary position-relative">
                        <i class="bi bi-bell fs-5"></i>
                    </button>
                    <div class="dropdown">
                        <button class="btn btn-link text-secondary dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-4"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); App.showConnectModal()"><i class="bi bi-plug me-2"></i>Connection</a></li>
                            <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); App.navigate('config')"><i class="bi bi-gear me-2"></i>Settings</a></li>
                            <li><hr class="dropdown-menu-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); API.disconnect()"><i class="bi bi-box-arrow-right me-2"></i>Disconnect</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Page Content -->
            <div id="pageContainer" class="flex-grow-1 overflow-auto p-4">
                <!-- Pages rendered here -->
            </div>
        </div>
    </div>

    <!-- Connection Modal -->
    <div class="modal fade" id="connectModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="bi bi-plug me-2"></i>Connect to Freqtrade</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Server URL</label>
                        <input type="text" class="form-control" id="serverUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Username</label>
                        <input type="text" class="form-control" id="serverUser" value="freqtrader" placeholder="Username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Password</label>
                        <input type="password" class="form-control" id="serverPass" placeholder="Password">
                    </div>
                    <div id="connectError" class="alert alert-danger small d-none"></div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="connectBtn" onclick="App.connect()">
                        <i class="bi bi-plug me-1"></i> Connect
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Node Properties Offcanvas (Strategy Builder) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="nodeProperties">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title" id="nodePropertiesTitle">Block Properties</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="nodePropertiesBody">
            <!-- Populated dynamically -->
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="js/api.js"></script>
    <script src="js/config-db.js"></script>
    <script src="js/components.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/strategy-builder.js"></script>
    <script src="js/backtesting.js"></script>
    <script src="js/strategy-store.js"></script>
    <script src="js/trades.js"></script>
    <script src="js/config-wizard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
