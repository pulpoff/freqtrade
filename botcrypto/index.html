<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotCrypto - Automated Crypto Trading</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lightweight Charts (TradingView) -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

    <!-- Custom Overrides -->
    <link rel="stylesheet" href="css/botcrypto.css?v=6">
</head>
<body>
    <div id="app" class="d-flex">
        <!-- Sidebar Backdrop (mobile) -->
        <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="App.closeSidebar()"></div>
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar d-flex flex-column flex-shrink-0">
            <div class="sidebar-header px-3 py-3 border-bottom border-secondary d-flex align-items-center justify-content-between">
                <a href="#dashboard" class="d-flex align-items-center text-decoration-none" onclick="event.preventDefault(); App.onLogoClick(event)">
                    <div class="logo-icon me-2">
                        <i class="bi bi-robot"></i>
                    </div>
                    <span class="logo-text fw-bold fs-5 text-white">botcrypto</span>
                </a>
                <button class="btn btn-link text-secondary p-0 sidebar-collapse-btn" onclick="App.toggleSidebarCollapse()" title="Collapse sidebar">
                    <i class="bi bi-chevron-bar-left fs-5"></i>
                </button>
            </div>
            <ul class="nav nav-pills flex-column px-2 py-3 flex-grow-1" id="sidebarNav">
                <li class="nav-item">
                    <a class="nav-link active" href="#dashboard" data-page="dashboard" onclick="event.preventDefault(); App.navigate('dashboard')">
                        <i class="bi bi-grid-1x2 me-2"></i><span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#strategies" data-page="strategies" onclick="event.preventDefault(); App.navigate('strategies')">
                        <i class="bi bi-diagram-3 me-2"></i><span>My strategies</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#strategy-builder" data-page="strategy-builder" onclick="event.preventDefault(); App.navigate('strategy-builder')">
                        <i class="bi bi-diagram-3 me-2"></i><span>Strategy Builder</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#backtesting" data-page="backtesting" onclick="event.preventDefault(); App.navigate('backtesting')">
                        <i class="bi bi-clock-history me-2"></i><span>Backtest</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#strategy-store" data-page="strategy-store" onclick="event.preventDefault(); App.navigate('strategy-store')">
                        <i class="bi bi-shop me-2"></i><span>Strategy Store</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#portfolio" data-page="portfolio" onclick="event.preventDefault(); App.navigate('portfolio')">
                        <i class="bi bi-wallet2 me-2"></i><span>Portfolio</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#trades" data-page="trades" onclick="event.preventDefault(); App.navigate('trades')">
                        <i class="bi bi-arrow-left-right me-2"></i><span>Trades</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#webhooks" data-page="webhooks" onclick="event.preventDefault(); App.navigate('webhooks')">
                        <i class="bi bi-link-45deg me-2"></i><span>Webhooks</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#config" data-page="config" onclick="event.preventDefault(); App.navigate('config')">
                        <i class="bi bi-gear me-2"></i><span>Configuration</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#logs" data-page="logs" onclick="event.preventDefault(); App.navigate('logs')">
                        <i class="bi bi-terminal me-2"></i><span>Log</span>
                    </a>
                </li>
            </ul>
            <div class="px-3 py-3 border-top border-secondary">
                <div class="d-flex align-items-center" id="connectionStatus" style="cursor:pointer" onclick="App.reconnect()" title="Click to reconnect">
                    <span class="status-dot disconnected me-2"></span>
                    <small class="text-secondary status-text">Disconnected</small>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-wrapper flex-grow-1 d-flex flex-column">
            <!-- Mobile hamburger (shown only on small screens) -->
            <button class="btn btn-link text-secondary d-md-none position-fixed" id="menuToggle" onclick="App.toggleSidebar()"
                style="top:10px;left:10px;z-index:1040">
                <i class="bi bi-list fs-4"></i>
            </button>

            <!-- Page Content -->
            <div id="pageContainer" class="flex-grow-1 overflow-auto p-4">
                <!-- Pages rendered here -->
            </div>
        </div>
    </div>

    <!-- Node Properties Offcanvas (Strategy Builder) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="nodeProperties">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title" id="nodePropertiesTitle">Block Properties</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="nodePropertiesBody">
            <!-- Populated dynamically -->
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="js/api.js?v=6"></script>
    <script src="js/config-db.js?v=6"></script>
    <script src="js/components.js?v=6"></script>
    <script src="js/dashboard.js?v=6"></script>
    <script src="js/robots.js?v=6"></script>
    <script src="js/strategy-builder.js?v=6"></script>
    <script src="js/backtesting.js?v=6"></script>
    <script src="js/strategy-store.js?v=6"></script>
    <script src="js/portfolio.js?v=6"></script>
    <script src="js/trades.js?v=6"></script>
    <script src="js/webhooks.js?v=6"></script>
    <script src="js/config-wizard.js?v=6"></script>
    <script src="js/logs.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
